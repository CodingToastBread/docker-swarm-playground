global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 2s
    timeout client  30s
    timeout server  30s
    # 연결 실패 시 같은 서버로 재시도하지 않고 다른 노드로 넘긴다.
    retries 2
    option redispatch

# Mac의 localhost:8080 -> 세 노드의 swarm ingress(8080)로 분산
frontend web
    bind :8080
    default_backend swarm_nodes

backend swarm_nodes
    balance roundrobin
    # 백엔드 연결을 요청 간에 재사용하지 않는다.
    # 재사용하면 한 연결이 ingress IPVS의 같은 replica에 고정돼 분산이 한쪽으로 쏠린다.
    http-reuse never
    # 노드의 ingress를 통해 실제 HTTP 응답이 오는지로 노드 상태를 판단한다.
    option httpchk GET /
    default-server check inter 2s fall 2 rise 2
    server manager 172.30.0.10:8080
    server worker1 172.30.0.11:8080
    server worker2 172.30.0.12:8080

# 통계 페이지: http://localhost:8404
frontend stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 2s
