services:
  manager:
    image: docker:29-dind
    container_name: manager
    hostname: manager
    privileged: true
    # manager는 외부(Mac, 이후 CI 등)에서 원격 조작할 수 있게 Docker API를 TLS로 연다.
    # command를 지정하지 않으면 dind entrypoint가 기본 인자를 붙인다:
    #   --host=unix:///var/run/docker.sock --host=tcp://0.0.0.0:2376 --tlsverify ...
    # 인증서는 /certs에 사설 CA로 자동 생성되고, 개인키가 남아 있으면 재사용한다.
    environment:
      DOCKER_TLS_CERTDIR: /certs
    networks:
      swarm-net:
        ipv4_address: 172.30.0.10
    ports:
      - "127.0.0.1:2376:2376"   # Docker API (TLS). Mac 로컬에서만 접근 가능
    volumes:
      - ./stacks:/stacks
      - manager-data:/var/lib/docker
      - manager-certs:/certs                    # CA/서버/클라이언트 개인키 보관 → 재생성해도 같은 키 유지
      - ./certs/manager-client:/certs/client    # 클라이언트 인증서만 호스트로 꺼내 Mac/CI가 사용
    # 재시작 시 worker가 manager의 gossip(7946)보다 먼저 붙으면 join이 실패하고
    # 60초 주기 재시도까지 worker task가 ingress LB에 등록되지 않는다.
    # dockerd가 떠 있고, swarm 상태라면 7946까지 열린 뒤에 healthy로 판정한다.
    healthcheck:
      test: ["CMD-SHELL", "docker info >/dev/null 2>&1 && { [ \"$$(docker info --format '{{.Swarm.LocalNodeState}}')\" != active ] || nc -z 127.0.0.1 7946; }"]
      interval: 2s
      timeout: 5s
      retries: 30

  worker1:
    image: docker:29-dind
    container_name: worker1
    hostname: worker1
    privileged: true
    # TLS 없이 tcp://0.0.0.0:2375를 열면 dockerd가 경고용으로 시작을 ~15초 지연시킨다.
    # docker exec(unix 소켓)만 쓰므로 TCP API는 열지 않는다.
    command: ["dockerd", "--host=unix:///var/run/docker.sock"]
    networks:
      swarm-net:
        ipv4_address: 172.30.0.11
    volumes:
      - worker1-data:/var/lib/docker
    depends_on:
      manager:
        condition: service_healthy

  worker2:
    image: docker:29-dind
    container_name: worker2
    hostname: worker2
    privileged: true
    # TLS 없이 tcp://0.0.0.0:2375를 열면 dockerd가 경고용으로 시작을 ~15초 지연시킨다.
    # docker exec(unix 소켓)만 쓰므로 TCP API는 열지 않는다.
    command: ["dockerd", "--host=unix:///var/run/docker.sock"]
    networks:
      swarm-net:
        ipv4_address: 172.30.0.12
    volumes:
      - worker2-data:/var/lib/docker
    depends_on:
      manager:
        condition: service_healthy

  # Docker Desktop의 포트포워딩은 TCP 체크섬을 채우지 않은 패킷(0x0000)을 넘겨서,
  # ingress가 다른 노드로 VXLAN 전달하면 수신 노드에서 drop된다.
  # HAProxy가 TCP를 종료하고 새 연결로 넘겨 정상 체크섬을 보장하고,
  # 세 노드로 분산 + health check로 노드 장애 시 자동 제외한다.
  lb:
    image: haproxy:3.2-alpine
    container_name: lb
    networks:
      swarm-net:
        ipv4_address: 172.30.0.2
    ports:
      - "8080:8080"   # 서비스
      - "8404:8404"   # 통계 페이지
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - manager
      - worker1
      - worker2

networks:
  swarm-net:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  manager-data:
  manager-certs:
  worker1-data:
  worker2-data:
